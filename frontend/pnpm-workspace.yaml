packages:
  - 'packages/*'
  - 'apps/*'

# Every pnpm setting lives in this file, the only place pnpm 11 and later read them from (pnpm 10 also accepts .npmrc
# and the package.json "pnpm" field), so a pnpm major never has to move them.

# Strict, isolated node_modules: each package sees only the dependencies it declares (ADR-1064).
shamefullyHoist: false
# Install missing peer dependencies, and report (rather than fail on) peer-range mismatches between toolchain plugins.
autoInstallPeers: true
strictPeerDependencies: false

# `@types/node` describes the Node runtime pinned in .node-version, so every copy (including the peers Vite and Vitest
# auto-install) resolves to the root devDependency's range instead of the newest major (ADR-1152).
overrides:
  '@types/node': '$@types/node'
  # Lift the copies that security advisories name to their first fixed major, until every dependent asks for it:
  # minimatch GHSA-g3hv-75wg-m249 (eslint and typescript-eslint) and glob GHSA-3g3m-2fjr-6pw4 (Storybook's docgen
  # plugin). Each selector names only the vulnerable range, so it lifts nothing once the dependents move past it.
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'
  'glob@>=9.0.0 <14.0.2': '^14.0.2'

# Dependency install scripts are a supply-chain risk, so none runs unless it is reviewed and allowed here, and an
# unreviewed one fails the install rather than warning. esbuild's postinstall only re-verifies the platform binary that
# pnpm already installs as an optional dependency, so it is not needed.
strictDepBuilds: true
allowBuilds:
  esbuild: false

# A version must be published for three days (in minutes) before pnpm resolves it, so a compromised release is usually
# caught and pulled before it can reach the lockfile. This is the same window as the npm `cooldown` in
# .github/dependabot.yml, and it must never be shorter: Dependabot enforces its cooldown on every version already in the
# lockfile, so a younger one would fail its updates until it aged (ADR-1152). Security updates bypass both gates.
minimumReleaseAge: 4320
