name: Code review

# The NCode Review agent (NCodeGroup/code-review): as ncode-review[bot] it posts a neutral "Code review"
# check run, a summary comment and inline threads, and nothing requires it. It reviews a pull request once when it
# opens (drafts included, since that's when its author reviews it) and again when it's marked ready, unless that commit
# was already reviewed (the engine reads its own summary comment to tell); pushes in between start nothing. A top-level
# `/review` comment from someone with write access reviews the latest commit on demand; `/review explain F3` says
# whether a finding still holds, and `/review teach <rule>` files a rule as an issue, both on a closed pull request too.
# A `skip-review` label skips the automatic reviews.
#
# approve: true approves a pull request whose review leaves no blocker or should-fix finding open, which Scorecard's
# Code-Review check counts; a push dismisses the approval, so comment /review after one. GitHub counts an approval
# toward a ruleset's required approval only from a reviewer that can write, so NCode Review v1.5.0 and later, given
# approver-private-key, submit it as the NCode Review Approver, an app with Contents: write whose token, minted after
# the review, can only write pull requests; an earlier release warns that it doesn't know the input and approves as its
# own app, whose approval meets no required approval. The main ruleset sets the approvals a merge needs (ADR-1261).
# docs/decisions/project-template/0022-ncode-reviews-approval-gates-the-merge.md and
# 0036-a-required-approval-is-met-by-ncode-reviews-approver-app.md say why.
# v1.5.0 was released on 2026-11-21, under the three days ADR-0009 waits: approver-private-key needs it, so it is
# pinned by that record's commented exception, and this sentence goes once 2026-11-24 has passed.
#
# pull_request_target and issue_comment both run this file, the engine pin and the conventions from main, so a pull
# request can't change its own review. The engine fetches its code only to read it: nothing from it is built, run or
# installed.
#
# When a pull request closes, merged or not, the outcomes job records what became of each finding (fixed, dismissed,
# acknowledged or ignored) in the summary comment, by rules alone: no review and no model call. It needs no environment:
# the NCode Review app's key is an organization secret. The code-review environment, which only the default branch can
# deploy to, lets Anthropic's federation rule trust the review job and holds the NCode Review Approver's key,
# NCODE_REVIEW_APPROVER_PRIVATE_KEY, once tools/Enable-CodeReview.ps1 -ApproverPrivateKeyPath from
# NCodeGroup/code-review stores it.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # The engine checks a comment again (`/review`, `/review explain` or `/review teach`, from a writer, on a pull request
    # that isn't from a fork) and stops before any model call when it isn't one. A plain `/review` on a closed pull
    # request doesn't run, so it can't cancel or displace the outcomes job, which shares its concurrency group. The
    # explain and teach checks here and in the concurrency group must name the same commands.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot' && !contains(github.event.pull_request.labels.*.name, 'skip-review')) ||
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        (github.event.issue.state == 'open' || startsWith(github.event.comment.body, '/review explain') ||
          startsWith(github.event.comment.body, '/review teach')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Anthropic's federation rule trusts only jobs in this environment, which only the default branch can deploy to.
    environment: code-review
    timeout-minutes: 30
    # Each /review explain or /review teach comment gets its own group, so it never cancels a review in progress.
    concurrency:
      group: code-review-${{ (startsWith(github.event.comment.body, '/review explain') || startsWith(github.event.comment.body, '/review teach')) && format('command-{0}', github.event.comment.id) || github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      # The issues a pull request closes are context for its intent.
      issues: read
      pull-requests: read
    steps:
      - name: Check out the default branch for the conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Review
        # A release's full commit SHA, with its tag in the comment: the action receives the app key, the approver's key
        # and the Bedrock key, and a SHA is the one pin nobody can move. Dependabot opens each bump and updates both.
        uses: NCodeGroup/code-review@a4cdf65d2450e4e1b2b92ed53430ceb8026d4f97 # v1.5.0
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # A review that leaves no blocker or should-fix finding open approves the pull request.
          approve: true
          # NCode Review v1.5.0 and later submit the approval as the NCode Review Approver, so it can meet a required
          # approval; the key is a secret of the code-review environment, which only the default branch can deploy to.
          approver-private-key: ${{ secrets.NCODE_REVIEW_APPROVER_PRIVATE_KEY }}

  outcomes:
    # A closed pull request, merged or not, whoever closed it (a merge queue merges as a bot) and whatever its labels:
    # records what became of each finding, by rules alone. It makes no model call, so it runs outside the code-review
    # environment, without id-token: write, the Bedrock key or a checkout.
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The review's group: it waits for a review in progress, so that review's threads are counted, instead of cancelling it.
    concurrency:
      group: code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record the outcomes
        uses: NCodeGroup/code-review@a4cdf65d2450e4e1b2b92ed53430ceb8026d4f97 # v1.5.0
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
