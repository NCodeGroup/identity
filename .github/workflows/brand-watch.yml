name: Brand watch

# Every Monday, compares the NCodeGroup/brand release the brand locks pin with the newest release at least three days
# old, which Dependabot can't see. While the locks are behind, it keeps one open issue labeled brand-update; once the
# locks pin the newest release, it closes that issue (ADR-1516). build/brand-watch.ps1 does the work, and -DryRun shows
# what it would do.
on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Brand watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A manual run from another branch would run that branch's script with issues: write.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the brand-update issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./build/brand-watch.ps1
