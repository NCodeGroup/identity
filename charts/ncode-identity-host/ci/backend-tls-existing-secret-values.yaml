# A release whose pods serve a certificate from Secrets the operator created, for the server and the console, behind a controller the chart does not configure.
cell:
  name: ci-single-replica
  region: ci
  isControlPlane: true
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
backendTls:
  existingSecret: identity-tls
  ingressSecret: identity-ingress
ingress:
  enabled: true
  controller: other
  className: haproxy
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
managementConsole:
  enabled: true
  host: manage.example.com
  keyRings:
    client:
      pemSecret: identity-mgmt-client-key
    dpop:
      pemSecret: identity-mgmt-dpop-key
  backendTls:
    existingSecret: identity-console-tls
