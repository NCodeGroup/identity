# A production release of a cell that is not the control plane: a dedicated cell spanning two cloud regions, which
# reaches its management API at its own URL, accepts platform and team management tokens from the control-plane cell's
# issuer, and reaches the platform's directory at its URL.
cell:
  name: ci-cell-eu
  region: eu
  kind: dedicated
  cloudRegions:
    - eu-west-1
    - eu-central-1
  managementUrl: https://manage.eu.example.com
  controlPlaneIssuer: https://id.example.com
directory:
  url: https://directory.example.com
  clientId: cell-ci-cell-eu
  keyRing: cell-client
  keys:
    pemSecret: cell-client-key
allowedHosts:
  - id.eu.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.eu.example.com
    tenantId: ci-eu
    displayName: CI EU
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
