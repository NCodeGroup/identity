# A production release of a workload cell: a dedicated cell spanning two cloud regions, which reaches its management API
# at its own URL, accepts platform and team management tokens from the control-plane cell's issuer, and reaches the
# platform's directory at its URL. A workload cell of a platform with a directory serves a dynamic strategy, here
# DynamicByPath, so its root tenant ci-eu-manage is its management tenant and each customer tenant is served beneath
# its own path.
cell:
  name: ci-cell-eu
  region: eu
  kind: dedicated
  cloudRegions:
    - eu-west-1
    - eu-central-1
  managementUrl: https://manage.eu.example.com
  controlPlaneIssuer: https://id.example.com
directory:
  url: https://directory.example.com
  clientId: cell-ci-cell-eu
  keyRing: cell-client
  keys:
    pemSecret: cell-client-key
allowedHosts:
  - id.eu.example.com
tenantResolution:
  strategyCode: DynamicByPath
extraEnv:
  - name: OpenId__TenantResolution__Root__TenantId
    value: ci-eu-manage
  - name: OpenId__TenantResolution__Root__Issuer
    value: https://id.eu.example.com/ci-eu-manage
  - name: OpenId__TenantResolution__DynamicByPath__IssuerTemplate
    value: https://id.eu.example.com/{tenantId}
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
