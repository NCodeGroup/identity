# A production release of the control-plane cell that reaches the platform's global directory, which runs from its own
# chart, ncode-identity-directory. The cell authenticates to it as its own machine client cell-ci-directory, so its
# teams and platform changes reach the directory.
cell:
  name: ci-directory
  region: ci
  isControlPlane: true
  managementUrl: https://id.example.com
  controlPlaneIssuer: https://id.example.com
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
directory:
  url: https://directory.example.com
  clientId: cell-ci-directory
  keyRing: cell-client
  caCertificates:
    existingSecret: directory-ca
  keys:
    pemSecret: cell-client-key
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
