# A throwaway Postgres for the kind cluster the chart workflow installs the host chart in. The workflow applies it to
# the namespace of a database, `identity` for the cell and `directory-db` for the directory, and creates the Secrets it
# reads in that namespace: 'postgres-app' (the schema owner, the superuser the image creates) and 'postgres-runtime'
# (the runtime role 'ncode_identity_app'), each with the keys 'host', 'port', 'dbname', 'user' and 'password'; no
# password is stored here. The init script creates the runtime role as a login role that is not a superuser and does
# not bypass row-level security. The data lives in an emptyDir, so it is lost with the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  # The image's entrypoint runs the scripts of /docker-entrypoint-initdb.d once, when it initializes the data
  # directory, with POSTGRES_USER and POSTGRES_DB set.
  10-runtime-role.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v runtime_password="$RUNTIME_PASSWORD" \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    CREATE ROLE ncode_identity_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD :'runtime_password';
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-runtime
                  key: password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
