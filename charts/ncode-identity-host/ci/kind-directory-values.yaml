# A production release of the dedicated control-plane cell for a kind cluster that reaches the global directory,
# installed from its own chart, as its own machine client cell-control-plane, with its setup Job. Its name, kind, region,
# tenant and issuer are the ones the directory chart's ci/kind-values.yaml registers for the control-plane cell. The
# platform enables client_credentials for the setup Job's automation client. The host image is built from the
# repository and loaded into the cluster's nodes, so it is never pulled. Traefik routes id.example.com to the cell. The
# workflow creates the runtime and owner database Secrets, the root key Secret, the setup Job's Secret and the directory
# client's key Secret this release names.
image:
  repository: ncode-identity-host
  tag: kind
  pullPolicy: Never
cell:
  name: control-plane
  region: ci
  kind: dedicated
  isControlPlane: true
  managementUrl: https://id.example.com
  controlPlaneIssuer: https://id.example.com
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
    tenantId: control-plane
database:
  parts:
    existingSecret: postgres-runtime
  runtimeRole: ncode_identity_app
migrations:
  database:
    parts:
      existingSecret: postgres-app
platform:
  grantTypesEnabled:
    - client_credentials
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    disabled: true
setup:
  job:
    enabled: true
    existingSecret: identity-setup-root
ingress:
  enabled: true
  controller: traefik
  className: traefik
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
directory:
  url: https://directory.example.com
  clientId: cell-control-plane
  keyRing: cell-client
  keys:
    pemSecret: cell-client-key
