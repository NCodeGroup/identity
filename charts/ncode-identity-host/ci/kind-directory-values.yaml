# A production release of the control-plane cell for a kind cluster that runs the global directory and reaches it as its
# own machine client cell-ci-kind, installed in one release with its setup Job. The host and directory images are built
# from the repository and loaded into the cluster's nodes, so they are never pulled. Traefik routes id.example.com to
# the cell and directory.example.com to the directory through the release's ServersTransports. The workflow creates the
# runtime and owner database Secrets of the cell and of the directory, the root key Secret, the setup Job's Secret and
# the directory client's key Secret this release names.
image:
  repository: ncode-identity-host
  tag: kind
  pullPolicy: Never
cell:
  name: ci-kind
  region: ci
  isControlPlane: true
  managementUrl: https://id.example.com
  controlPlaneIssuer: https://id.example.com
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  parts:
    existingSecret: postgres-runtime
  runtimeRole: ncode_identity_app
migrations:
  database:
    parts:
      existingSecret: postgres-app
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    disabled: true
setup:
  job:
    enabled: true
    existingSecret: identity-setup-root
ingress:
  enabled: true
  controller: traefik
  className: traefik
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
directory:
  url: https://directory.example.com
  clientId: cell-ci-kind
  keyRing: cell-client
  keys:
    pemSecret: cell-client-key
  enabled: true
  issuer: https://id.example.com
  controlPlaneCell: ci-kind
  allowedHosts:
    - directory.example.com
  image:
    repository: ncode-identity-directory
    tag: kind
    pullPolicy: Never
  database:
    runtimeRole: ncode_identity_app
    parts:
      existingSecret: directory-postgres-runtime
  migrations:
    database:
      parts:
        existingSecret: directory-postgres-app
  ingress:
    enabled: true
    className: traefik
