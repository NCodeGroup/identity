# A production release of a customer cell, a workload cell of a platform with a directory. It serves DynamicByPath, so
# its root tenant ci-eu-manage is its management tenant and each customer tenant is served beneath its own path. Its
# setup Job runs with the cell's directory client on an empty database: it reserves the management tenant through the
# directory, creates the cell's first CellAdmin and registers the cell console's client. The cell console signs in
# against the management tenant and calls only this cell's management API, so the cell is managed, and the tenants of
# the teams that grant it are created, with the control-plane cell and the platform console down.
cell:
  name: ci-cell-console
  region: eu
  managementUrl: https://manage.eu.example.com
  controlPlaneIssuer: https://id.example.com
directory:
  url: https://directory.example.com
  clientId: cell-ci-cell-console
  keyRing: cell-client
  keys:
    pemSecret: cell-client-key
allowedHosts:
  - manage.eu.example.com
tenantResolution:
  strategyCode: DynamicByPath
extraEnv:
  - name: OpenId__TenantResolution__Root__TenantId
    value: ci-eu-manage
  - name: OpenId__TenantResolution__Root__Issuer
    value: https://manage.eu.example.com/ci-eu-manage
  - name: OpenId__TenantResolution__DynamicByPath__IssuerTemplate
    value: https://manage.eu.example.com/{tenantId}
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
ingress:
  enabled: true
  controller: traefik
  className: traefik
  hosts:
    - host: manage.eu.example.com
      paths:
        - path: /
          pathType: Prefix
setup:
  job:
    enabled: true
    existingSecret: identity-setup-admin
  managementConsole:
    clientId: mgmt-console
    baseUrl: https://console.eu.example.com
    jwks: '{"keys":[{"kty":"EC","crv":"P-256","kid":"mgmt-client","x":"f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU","y":"x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"}]}'
managementConsole:
  enabled: true
  cellConsole: true
  host: console.eu.example.com
  authority: https://manage.eu.example.com/ci-eu-manage
  keyRings:
    client:
      pemSecret: identity-mgmt-client-key
    dpop:
      pemSecret: identity-mgmt-dpop-key
  ingress:
    enabled: true
    className: traefik
    tls:
      - secretName: console-eu-example-com-tls
        hosts:
          - console.eu.example.com
