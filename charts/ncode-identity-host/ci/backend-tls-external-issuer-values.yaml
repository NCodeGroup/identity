# A release whose pods' certificate comes from the organization's cert-manager ClusterIssuer, behind a controller the chart does not configure.
cell:
  name: ci-single-replica
  region: ci
  isControlPlane: true
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
  runtimeRole: ncode_identity_app
migrations:
  database:
    existingSecret: identity-database-owner
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
backendTls:
  certManager:
    issuerRef:
      name: corp-ca
      kind: ClusterIssuer
    dnsNames:
      - id.internal.example.com
ingress:
  enabled: true
  controller: other
  className: haproxy
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
