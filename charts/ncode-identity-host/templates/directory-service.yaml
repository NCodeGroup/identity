{{- if .Values.directory.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "identity-host.directory.fullname" . }}
  labels:
    {{- include "identity-host.directory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.directory.service.type }}
  ports:
    - name: https
      port: {{ .Values.directory.service.port }}
      targetPort: https
      protocol: TCP
      appProtocol: https
  selector:
    {{- include "identity-host.directory.selectorLabels" . | nindent 4 }}
{{- end }}
