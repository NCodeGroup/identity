{{- if and .Values.directory.enabled .Values.directory.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "identity-host.directory.serviceAccountName" . }}
  labels:
    {{- include "identity-host.directory.labels" . | nindent 4 }}
  {{- with .Values.directory.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
